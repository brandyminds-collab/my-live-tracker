<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seven Classic Ind. Ltd. - Live Material Tracker</title>

<style>
:root {
    --bg-color: #1a1d24;
    --card-bg: #13161c;
    --text-main: #ffffff;
    --text-muted: #8a92a6;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --yellow: #f1c40f;
    --border: #2c313d;
    --admin-bg: #1c212c;
}

* {
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    margin: 0;
    padding: 30px 20px;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 950px;
    margin: auto;
}

/* =========================
   ADMIN PANEL
========================= */

.admin-panel {
    background: var(--admin-bg);
    border: 2px dashed var(--blue);
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 25px;
    display: none;
}

.admin-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--blue);
    margin-bottom: 20px;
    text-transform: uppercase;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-size: 12px;
    color: var(--text-muted);
}

.form-group input,
.form-group select {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: white;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--blue);
}

.btn {
    padding: 10px 16px;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.btn-blue {
    background: var(--blue);
    color: white;
}

.btn-blue:hover {
    background: #2584c2;
}

.btn-red {
    background: var(--red);
    color: white;
    padding: 5px 9px;
    font-size: 12px;
}

.btn-edit {
    background: #f39c12;
    color: white;
    padding: 5px 9px;
    font-size: 12px;
    margin-right: 5px;
}

.btn-logout {
    background: #555;
    color: white;
    font-size: 12px;
    padding: 7px 12px;
}

.btn-logout:hover {
    background: #666;
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
    background: var(--card-bg);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid var(--border);
}

.header {
    margin-bottom: 25px;
}

.company-name {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
}

.title {
    font-size: 22px;
    margin: 6px 0 0;
    font-weight: 600;
}

/* TABLE */

.table-title-row,
.material-row {
    display: grid;
    grid-template-columns: 220px 1fr 180px 90px;
    gap: 20px;
    align-items: center;
}

.table-title-row {
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

.table-title-text {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: bold;
    text-transform: uppercase;
}

.materials-container {
    margin-bottom: 30px;
    min-height: 30px;
}

.material-row {
    margin-bottom: 25px;
}

.info-col {
    display: flex;
    flex-direction: column;
}

.material-name {
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
}

.material-name.highlight-blue {
    color: var(--blue);
}

.material-val {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
}

/* PROGRESS */

.progress-wrapper {
    background: #1a1e26;
    border-radius: 20px;
    height: 14px;
    width: 100%;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    border-radius: 20px;
    transition: width 0.5s ease;
}

.bg-green {
    background: var(--green);
}

.bg-red {
    background: var(--red);
}

.bg-yellow {
    background: var(--yellow);
}

.qty-col {
    text-align: right;
    font-weight: bold;
    font-size: 14px;
    line-height: 1.4;
}

.usd-live-val {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: normal;
    display: block;
}

.low-stock-text {
    color: var(--red);
}

.good-stock-text {
    color: var(--green);
}

/* AXIS */

.axis-labels {
    display: grid;
    grid-template-columns: 220px 1fr 180px 90px;
    gap: 20px;
    margin-bottom: 30px;
}

.labels-flex {
    grid-column: 2;
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
    font-size: 12px;
    padding: 0 5px;
}

/* FOOTER */

.footer-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--border);
    padding-top: 25px;
    text-align: center;
}

.metric-box {
    border-right: 1px solid var(--border);
}

.metric-box:last-child {
    border-right: none;
}

.metric-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
}

.metric-value {
    font-size: 24px;
    font-weight: bold;
}

.text-green {
    color: var(--green);
}

.text-red {
    color: var(--red);
}

.text-yellow {
    color: var(--yellow);
}

/* =========================
   ADMIN BUTTON
========================= */

.admin-trigger-zone {
    text-align: center;
    margin-top: 30px;
    padding-bottom: 20px;
    width: 100%;
}

.login-btn {
    background: #242933;
    border: 1px solid var(--border);
    color: #d1d5db;
    font-size: 14px;
    padding: 12px 28px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;

    display: inline-flex;
    align-items: center;
    gap: 8px;

    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.login-btn:hover {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
    transform: translateY(-2px);
}

/* ACTION COLUMN */

.action-col {
    display: none;
    text-align: center;
}

body.admin-logged-in .action-col {
    display: block;
}

/* EMPTY */

.empty-message {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 10px;
    border: 1px dashed var(--border);
    border-radius: 6px;
}

/* ADMIN STATUS */

.admin-status {
    color: var(--green);
    font-size: 12px;
    font-weight: normal;
    text-transform: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    body {
        padding: 15px;
    }

    .dashboard {
        padding: 20px 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .table-title-row {
        display: none;
    }

    .material-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;

        padding: 15px 0;
        border-bottom: 1px solid var(--border);
    }

    .progress-wrapper {
        margin-top: 5px;
    }

    .qty-col {
        text-align: left;
    }

    .action-col {
        text-align: left;
    }

    .axis-labels {
        display: none;
    }

    .footer-metrics {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .metric-box {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
    }

    .metric-box:last-child {
        border-bottom: none;
    }

    .title {
        font-size: 19px;
    }

    .admin-title {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =========================
         ADMIN PANEL
    ========================== -->

    <div class="admin-panel" id="adminPanel">

        <div class="admin-title">

            <div>
                Raw Materials Entry Form

                <span class="admin-status">
                    ● Admin Mode
                </span>
            </div>

            <button
                class="btn btn-logout"
                onclick="logoutAdmin()">
                Close Admin Panel
            </button>

        </div>

        <form id="materialForm" onsubmit="saveMaterial(event)">

            <div class="form-grid">

                <div class="form-group">
                    <label>Material Name</label>

                    <input
                        type="text"
                        id="matName"
                        required
                        placeholder="e.g. Duplex Board">
                </div>

                <div class="form-group">
                    <label>Maximum Qty (Capacity)</label>

                    <input
                        type="number"
                        id="maxQty"
                        min="0"
                        step="any"
                        required
                        placeholder="e.g. 10000">
                </div>

                <div class="form-group">
                    <label>Current Stock</label>

                    <input
                        type="number"
                        id="currentQty"
                        min="0"
                        step="any"
                        required
                        placeholder="e.g. 6000">
                </div>

                <div class="form-group">
                    <label>Unit</label>

                    <input
                        type="text"
                        id="unit"
                        required
                        placeholder="Kg, Pcs, Yards">
                </div>

                <div class="form-group">
                    <label>Full Budget Value ($)</label>

                    <input
                        type="number"
                        id="fullValue"
                        min="0"
                        step="any"
                        required
                        placeholder="e.g. 19000">
                </div>

                <div class="form-group">

                    <label>Highlight Blue?</label>

                    <select id="isBlue">

                        <option value="false">
                            No
                        </option>

                        <option value="true">
                            Yes
                        </option>

                    </select>

                </div>

            </div>

            <button
                type="submit"
                class="btn btn-blue"
                id="saveButton">
                Save & Update Stock
            </button>

            <button
                type="button"
                class="btn btn-logout"
                id="cancelEditButton"
                onclick="cancelEdit()"
                style="display:none;">
                Cancel Edit
            </button>

        </form>

    </div>


    <!-- =========================
         DASHBOARD
    ========================== -->

    <div class="dashboard">

        <div class="header">

            <div class="company-name">
                Seven Classic Ind. Ltd.
            </div>

            <div class="title">
                Live Raw Material Balance Tracker
            </div>

        </div>


        <!-- TABLE HEADER -->

        <div class="table-title-row">

            <div class="table-title-text">
                Raw Materials Name
            </div>

            <div></div>

            <div
                class="table-title-text"
                style="text-align:right;">
                Live Status / Stock
            </div>

            <div class="table-title-text action-col">
                Action
            </div>

        </div>


        <!-- MATERIALS -->

        <div
            class="materials-container"
            id="materials-list">

            <div class="empty-message">
                No raw materials added yet.
                <br>
                Login to Admin Panel to add materials.
            </div>

        </div>


        <!-- AXIS -->

        <div class="axis-labels">

            <div></div>

            <div class="labels-flex">

                <span>20%</span>
                <span>40%</span>
                <span>60%</span>
                <span>80%</span>
                <span>100%</span>

            </div>

            <div></div>
            <div></div>

        </div>


        <!-- FOOTER METRICS -->

        <div class="footer-metrics">

            <div class="metric-box">

                <div class="metric-label">
                    Total Value
                </div>

                <div
                    class="metric-value"
                    id="total-value">
                    $0
                </div>

            </div>


            <div class="metric-box">

                <div class="metric-label">
                    Current Asset Value
                </div>

                <div
                    class="metric-value text-green"
                    id="current-asset-value">
                    $0
                </div>

            </div>


            <div class="metric-box">

                <div class="metric-label">
                    Low Balance Warning
                </div>

                <div
                    class="metric-value"
                    id="low-warning">
                    0
                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         ADMIN ACCESS BUTTON
    ========================== -->

    <div class="admin-trigger-zone">

        <button
            class="login-btn"
            onclick="openAdminPanel()">

            🔐 Admin Panel Access

        </button>

    </div>

</div>


<script>

/* ==========================================
   SETTINGS
========================================== */

const ADMIN_PASSWORD = "admin123";

const STORAGE_KEY = "sevenClassicMaterials";

let materials = [];

let editingIndex = -1;


/* ==========================================
   LOAD DATA
========================================== */

function loadMaterials() {

    const savedData =
        localStorage.getItem(STORAGE_KEY);

    if (savedData) {

        try {

            materials = JSON.parse(savedData);

        } catch (error) {

            materials = [];

        }

    } else {

        materials = [];

    }

    renderMaterials();
}


/* ==========================================
   SAVE DATA
========================================== */

function saveToStorage() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(materials)
    );

}


/* ==========================================
   ADMIN LOGIN
========================================== */

function openAdminPanel() {

    const password =
        prompt("Enter Admin Password:");

    if (password === null) {
        return;
    }

    if (password === ADMIN_PASSWORD) {

        document
            .getElementById("adminPanel")
            .style.display = "block";

        document
            .body
            .classList
            .add("admin-logged-in");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    } else {

        alert("❌ Incorrect Admin Password!");

    }

}


/* ==========================================
   LOGOUT
========================================== */

function logoutAdmin() {

    document
        .getElementById("adminPanel")
        .style.display = "none";

    document
        .body
        .classList
        .remove("admin-logged-in");

    cancelEdit();

}


/* ==========================================
   SAVE / UPDATE MATERIAL
========================================== */

function saveMaterial(event) {

    event.preventDefault();

    const name =
        document
            .getElementById("matName")
            .value
            .trim();

    const maxQty =
        Number(
            document
                .getElementById("maxQty")
                .value
        );

    const currentQty =
        Number(
            document
                .getElementById("currentQty")
                .value
        );

    const unit =
        document
            .getElementById("unit")
            .value
            .trim();

    const fullValue =
        Number(
            document
                .getElementById("fullValue")
                .value
        );

    const isBlue =
        document
            .getElementById("isBlue")
            .value === "true";


    /* Validation */

    if (!name) {

        alert("Please enter material name.");
        return;

    }

    if (maxQty <= 0) {

        alert("Maximum quantity must be greater than 0.");
        return;

    }

    if (currentQty < 0) {

        alert("Current stock cannot be negative.");
        return;

    }

    if (currentQty > maxQty) {

        alert("Current stock cannot be greater than maximum capacity.");
        return;

    }

    if (fullValue < 0) {

        alert("Budget value cannot be negative.");
        return;

    }


    const material = {

        name: name,

        maxQty: maxQty,

        currentQty: currentQty,

        unit: unit,

        fullValue: fullValue,

        isBlue: isBlue

    };


    /* UPDATE */

    if (editingIndex !== -1) {

        materials[editingIndex] = material;

        alert("✅ Material updated successfully.");

    }

    /* ADD */

    else {

        materials.push(material);

        alert("✅ Material added successfully.");

    }


    saveToStorage();

    renderMaterials();

    resetForm();

}


/* ==========================================
   RENDER MATERIALS
========================================== */

function renderMaterials() {

    const container =
        document.getElementById("materials-list");

    container.innerHTML = "";


    if (materials.length === 0) {

        container.innerHTML = `
            <div class="empty-message">
                No raw materials added yet.
                <br>
                Login to Admin Panel to add materials.
            </div>
        `;

        updateMetrics();

        return;

    }


    materials.forEach((material, index) => {

        let percentage =
            (material.currentQty / material.maxQty) * 100;

        percentage =
            Math.max(
                0,
                Math.min(100, percentage)
            );


        /* Current financial value */

        const currentValue =
            material.fullValue *
            (percentage / 100);


        /* Color */

        let progressClass =
            "bg-green";

        let stockClass =
            "good-stock-text";


        if (percentage < 20) {

            progressClass = "bg-red";
            stockClass = "low-stock-text";

        } else if (percentage < 40) {

            progressClass = "bg-yellow";

        }


        const blueClass =
            material.isBlue
                ? "highlight-blue"
                : "";


        const row =
            document.createElement("div");

        row.className =
            "material-row";


        row.innerHTML = `

            <div class="info-col">

                <div class="material-name ${blueClass}">
                    ${escapeHTML(material.name)}
                </div>

                <div class="material-val">
                    Total:
                    ${formatNumber(material.maxQty)}
                    ${escapeHTML(material.unit)}
                    (${formatTon(material.maxQty)} TON)
                </div>

            </div>


            <div>

                <div class="progress-wrapper">

                    <div
                        class="progress-bar ${progressClass}"
                        style="width:${percentage}%;">
                    </div>

                </div>

            </div>


            <div class="qty-col">

                <span class="${stockClass}">
                    ${formatNumber(material.currentQty)}
                    ${escapeHTML(material.unit)}
                </span>

                <span class="usd-live-val">
                    ${percentage.toFixed(1)}%
                    &nbsp; | &nbsp;
                    $${formatMoney(currentValue)}
                </span>

            </div>


            <div class="action-col">

                <button
                    class="btn btn-edit"
                    onclick="editMaterial(${index})">
                    Edit
                </button>

                <button
                    class="btn btn-red"
                    onclick="deleteMaterial(${index})">
                    Delete
                </button>

            </div>

        `;


        container.appendChild(row);

    });


    updateMetrics();

}


/* ==========================================
   UPDATE METRICS
========================================== */

function updateMetrics() {

    let totalValue = 0;

    let currentAssetValue = 0;

    let lowBalanceCount = 0;


    materials.forEach(material => {

        totalValue +=
            Number(material.fullValue);


        const percentage =
            material.maxQty > 0
                ? material.currentQty /
                  material.maxQty
                : 0;


        currentAssetValue +=
            material.fullValue *
            percentage;


        if (percentage < 0.20) {

            lowBalanceCount++;

        }

    });


    document
        .getElementById("total-value")
        .textContent =
        "$" + formatMoney(totalValue);


    document
        .getElementById("current-asset-value")
        .textContent =
        "$" + formatMoney(currentAssetValue);


    const warning =
        document.getElementById("low-warning");


    warning.textContent =
        lowBalanceCount;


    if (lowBalanceCount > 0) {

        warning.className =
            "metric-value text-red";

    } else {

        warning.className =
            "metric-value text-green";

    }

}


/* ==========================================
   EDIT MATERIAL
========================================== */

function editMaterial(index) {

    const material =
        materials[index];

    document
        .getElementById("matName")
        .value =
        material.name;

    document
        .getElementById("maxQty")
        .value =
        material.maxQty;

    document
        .getElementById("currentQty")
        .value =
        material.currentQty;

    document
        .getElementById("unit")
        .value =
        material.unit;

    document
        .getElementById("fullValue")
        .value =
        material.fullValue;

    document
        .getElementById("isBlue")
        .value =
        material.isBlue
            ? "true"
            : "false";


    editingIndex = index;


    document
        .getElementById("saveButton")
        .textContent =
        "Update Material";


    document
        .getElementById("cancelEditButton")
        .style
        .display =
        "inline-block";


    document
        .getElementById("adminPanel")
        .style
        .display =
        "block";


    document
        .body
        .classList
        .add("admin-logged-in");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   DELETE MATERIAL
========================================== */

function deleteMaterial(index) {

    const material =
        materials[index];


    const confirmDelete =
        confirm(
            `Are you sure you want to delete "${material.name}"?`
        );


    if (!confirmDelete) {
        return;
    }


    materials.splice(index, 1);

    saveToStorage();

    renderMaterials();


    alert("🗑️ Material deleted.");

}


/* ==========================================
   CANCEL EDIT
========================================== */

function cancelEdit() {

    editingIndex = -1;

    resetForm();

}


/* ==========================================
   RESET FORM
========================================== */

function resetForm() {

    document
        .getElementById("materialForm")
        .reset();


    document
        .getElementById("isBlue")
        .value =
        "false";


    document
        .getElementById("saveButton")
        .textContent =
        "Save & Update Stock";


    document
        .getElementById("cancelEditButton")
        .style
        .display =
        "none";


    editingIndex = -1;

}


/* ==========================================
   FORMAT NUMBER
========================================== */

function formatNumber(number) {

    return Number(number).toLocaleString(
        "en-US",
        {
            maximumFractionDigits: 2
        }
    );

}


/* ==========================================
   FORMAT MONEY
========================================== */

function formatMoney(number) {

    return Number(number).toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }
    );

}


/* ==========================================
   FORMAT TON
========================================== */

function formatTon(kg) {

    return Number(kg / 1000).toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }
    );

}


/* ==========================================
   SECURITY / HTML ESCAPE
========================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   START APP
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadMaterials();

    }
);

</script>

</body>
</html>
