<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seven Classic Ind. Ltd. - Live Material Tracker</title>

<style>
:root {
    --bg-color: #1a1d24;
    --card-bg: #13161c;
    --text-main: #ffffff;
    --text-muted: #8a92a6;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --yellow: #f1c40f;
    --border: #2c313d;
    --admin-bg: #1c212c;
}

* {
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-color);
    color: var(--text-main);
    margin: 0;
    padding: 30px 20px;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 950px;
    margin: auto;
}

/* =========================
   ADMIN PANEL
========================= */

.admin-panel {
    background: var(--admin-bg);
    border: 2px dashed var(--blue);
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 25px;
    display: none;
}

.admin-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--blue);
    margin-bottom: 20px;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-size: 12px;
    color: var(--text-muted);
}

.form-group input,
.form-group select {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: white;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--blue);
}

.btn {
    padding: 10px 16px;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.btn-blue {
    background: var(--blue);
    color: white;
}

.btn-blue:hover {
    background: #2584c2;
}

.btn-red {
    background: var(--red);
    color: white;
    padding: 5px 9px;
    font-size: 12px;
}

.btn-edit {
    background: #f39c12;
    color: white;
    padding: 5px 9px;
    font-size: 12px;
    margin-right: 5px;
}

.btn-logout {
    background: #555;
    color: white;
    font-size: 12px;
    padding: 7px 12px;
}

.btn-logout:hover {
    background: #666;
}

/* =========================
   DASHBOARD
========================= */

.dashboard {
    background: var(--card-bg);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid var(--border);
}

.header {
    margin-bottom: 25px;
}

.company-name {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
}

.title {
    font-size: 22px;
    margin: 6px 0 0;
    font-weight: 600;
}

/* TABLE */

.table-title-row,
.material-row {
    display: grid;
    grid-template-columns: 220px 1fr 180px 90px;
    gap: 20px;
    align-items: center;
}

body.admin-logged-in .table-title-row,
body.admin-logged-in .material-row {
    grid-template-columns: 200px 1fr 150px 80px 120px;
}

.table-title-row {
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

.table-title-text {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: bold;
    text-transform: uppercase;
}

.materials-container {
    margin-bottom: 30px;
    min-height: 30px;
}

.material-row {
    margin-bottom: 25px;
}

.info-col {
    display: flex;
    flex-direction: column;
}

.material-name {
    font-size: 16px;
    font-weight: bold;
    text-transform: uppercase;
}

.material-name.highlight-blue {
    color: var(--blue);
}

.material-val {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
}

/* PROGRESS */

.progress-wrapper {
    background: #1a1e26;
    border-radius: 20px;
    height: 14px;
    width: 100%;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    border-radius: 20px;
    transition: width 0.5s ease;
}

.bg-green {
    background: var(--green);
}

.bg-red {
    background: var(--red);
}

.bg-yellow {
    background: var(--yellow);
}

.qty-col {
    text-align: right;
    font-weight: bold;
    font-size: 14px;
    line-height: 1.4;
}

.usd-live-val {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: normal;
    display: block;
}

.low-stock-text {
    color: var(--red);
}

.good-stock-text {
    color: var(--green);
}

/* AXIS */

.axis-labels {
    display: grid;
    grid-template-columns: 220px 1fr 180px 90px;
    gap: 20px;
    margin-bottom: 30px;
}

body.admin-logged-in .axis-labels {
    grid-template-columns: 200px 1fr 150px 80px 120px;
}

.labels-flex {
    grid-column: 2;
    display: flex;
    justify-content: space-between;
    color: var(--text-muted);
    font-size: 12px;
    padding: 0 5px;
}

/* FOOTER */

.footer-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--border);
    padding-top: 25px;
    text-align: center;
}

.metric-box {
    border-right: 1px solid var(--border);
}

.metric-box:last-child {
    border-right: none;
}

.metric-label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-bottom: 8px;
}

.metric-value {
    font-size: 24px;
    font-weight: bold;
}

.text-green {
    color: var(--green);
}

.text-red {
    color: var(--red);
}

.text-yellow {
    color: var(--yellow);
}

/* =========================
   CUSTOM FOOTER COPYRIGHT
========================= */

.custom-copyright {
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 40px;
    padding-top: 15px;
    border-top: 1px solid var(--border);
    letter-spacing: 0.5px;
}

/* =========================
   ADMIN BUTTON
========================= */

.admin-trigger-zone {
    text-align: center;
    margin-top: 20px;
    padding-bottom: 20px;
    width: 100%;
}

.login-btn {
    background: #242933;
    border: 1px solid var(--border);
    color: #d1d5db;
    font-size: 14px;
    padding: 12px 28px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.login-btn:hover {
    background: var(--blue);
    color: white;
    border-color: var(--blue);
    transform: translateY(-2px);
}

/* ACTION COLUMN */

.action-col {
    display: none;
    text-align: center;
}

body.admin-logged-in .action-col {
    display: block;
}

/* EMPTY */

.empty-message {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 10px;
    border: 1px dashed var(--border);
    border-radius: 6px;
}

/* ADMIN STATUS */

.admin-status {
    color: var(--green);
    font-size: 12px;
    font-weight: normal;
    text-transform: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {
    body {
        padding: 15px;
    }

    .dashboard {
        padding: 20px 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .table-title-row {
        display: none;
    }

    .material-row,
    body.admin-logged-in .material-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 15px 0;
        border-bottom: 1px solid var(--border);
    }

    .progress-wrapper {
        margin-top: 5px;
    }

    .qty-col {
        text-align: left;
    }

    .action-col {
        text-align: left;
    }

    .axis-labels,
    body.admin-logged-in .axis-labels {
        display: none;
    }

    .footer-metrics {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .metric-box {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding-bottom: 15px;
    }

    .metric-box:last-child {
        border-bottom: none;
    }

    .title {
        font-size: 19px;
    }

    .admin-title {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- =========================
         ADMIN PANEL
    ========================== -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">
            <div>
                Raw Materials Entry Form
                <span class="admin-status">● Admin Mode</span>
            </div>
            <button class="btn btn-logout" onclick="logoutAdmin()">Close Admin Panel</button>
        </div>

        <form id="materialForm" onsubmit="handleFormSubmit(event)">
            <input type="hidden" id="editIndex" value="">
            <div class="form-grid">
                <div class="form-group">
                    <label for="matName">Material Name</label>
                    <input type="text" id="matName" required placeholder="e.g. Cotton Yarn 30s">
                </div>
                <div class="form-group">
                    <label for="matUnit">Unit Measurement</label>
                    <input type="text" id="matUnit" required placeholder="e.g. Lbs, Kgs, Pcs">
                </div>
                <div class="form-group">
                    <label for="matCurrent">Current Quantity</label>
                    <input type="number" id="matCurrent" required min="0" placeholder="0">
                </div>
                <div class="form-group">
                    <label for="matMax">Target/Max Storage</label>
                    <input type="number" id="matMax" required min="1" placeholder="1000">
                </div>
                <div class="form-group">
                    <label for="matPrice">Unit Price (USD)</label>
                    <input type="number" id="matPrice" required min="0" step="0.01" placeholder="0.00">
                </div>
