<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seven Classic Ind. Ltd. - Material Balance Tracker</title>

<style>

:root {
    --bg-color: #1a1d24;
    --card-bg: #13161c;
    --text-main: #ffffff;
    --text-muted: #8a92a6;
    --green: #2ecc71;
    --red: #e74c3c;
    --blue: #3498db;
    --yellow: #f1c40f;
    --border: #2c313d;
    --admin-bg: #1c212c;
}

* {
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-main);
    margin: 0;
    padding: 25px 15px;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}


/* =====================================================
   ADMIN PANEL
===================================================== */

.admin-panel {
    background-color: var(--admin-bg);
    border: 2px dashed var(--blue);
    border-radius: 8px;
    padding: 25px;
    margin-bottom: 25px;
    display: none;
}

.admin-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--blue);
    margin-bottom: 20px;
    text-transform: uppercase;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.admin-status {
    color: var(--green);
    font-size: 12px;
    font-weight: normal;
    text-transform: none;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.form-group label {
    font-size: 12px;
    color: var(--text-muted);
}

.form-group input,
.form-group select {
    width: 100%;
    background-color: var(--card-bg);
    border: 1px solid var(--border);
    color: #fff;
    padding: 10px;
    border-radius: 5px;
    font-size: 14px;
    outline: none;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--blue);
}

.btn {
    padding: 10px 16px;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.btn-blue {
    background-color: var(--blue);
    color: #fff;
}

.btn-blue:hover {
    background-color: #2584c2;
}

.btn-red {
    background-color: var(--red);
    color: #fff;
    padding: 5px 9px;
    font-size: 12px;
}

.btn-edit {
    background-color: #f39c12;
    color: #fff;
    padding: 5px 9px;
    font-size: 12px;
    margin-bottom: 4px;
}

.btn-logout {
    background-color: #555;
    color: #fff;
    font-size: 12px;
    padding: 7px 12px;
}


/* =====================================================
   DASHBOARD
===================================================== */

.dashboard {
    background-color: var(--card-bg);
    border-radius: 8px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid var(--border);
}

.header {
    margin-bottom: 25px;
}

.company-name {
    font-size: 35px;
    color: var(--text-muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: bold;
}

.title {
    font-size: 26px;
    margin: 6px 0 0 0;
    font-weight: 600;
}


/* =====================================================
   TABLE
===================================================== */

.table-title-row,
.material-row {

    display: grid;

    grid-template-columns:
        190px
        minmax(180px, 1fr)
        140px
        110px
        130px
        85px;

    gap: 15px;

    align-items: center;
}

.table-title-row {

    margin-bottom: 18px;

    padding-bottom: 12px;

    border-bottom:
        1px solid var(--border);
}

.table-title-text {

    font-size: 16px;

    color: var(--text-muted);

    font-weight: bold;

    text-transform: uppercase;
}

.materials-container {

    margin-bottom: 25px;

    min-height: 30px;
}

.material-row {

    margin-bottom: 25px;
}


/* =====================================================
   MATERIAL
===================================================== */

.info-col {
    display: flex;
    flex-direction: column;
}

.material-name {
    font-size: 20px;
    font-weight: bold;
    text-transform: uppercase;
}

.material-name.highlight-blue {
    color: var(--blue);
}

.material-val {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-wrapper {
    background-color: #1a1e26;
    border-radius: 20px;
    height: 14px;
    width: 100%;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    border-radius: 20px;
    transition: width 0.5s ease;
}

.bg-green {
    background-color: var(--green);
}

.bg-red {
    background-color: var(--red);
}

.bg-yellow {
    background-color: var(--yellow);
}


/* =====================================================
   REMAINING BALANCE
===================================================== */

.qty-col {
    text-align: right;
    font-weight: bold;
    font-size: 20px;
    line-height: 1.4;
}

.good-stock-text {
    color: var(--red);
}

.low-stock-text {
    color: var(--green);
}

.usd-live-val {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: normal;
}


/* =====================================================
   UNIT PRICE
===================================================== */

.unit-price-col {
    text-align: right;
    font-size: 20px;
    font-weight: bold;
}

.price-label {
    display: block;
    color: var(--text-muted);
    font-size: 10px;
    font-weight: normal;
    margin-top: 3px;
}


/* =====================================================
   TOTAL VALUE
===================================================== */

.total-value-col {
    text-align: right;
    color: var(--green);
    font-size: 20px;
    font-weight: bold;
}


/* =====================================================
   ACTION
===================================================== */

.action-col {
    display: none;
    text-align: center;
}

body.admin-logged-in .action-col {
    display: block;
}


/* =====================================================
   AXIS LABELS
===================================================== */

.axis-labels {

    display: grid;

    grid-template-columns:
        190px
        minmax(180px, 1fr)
        140px
        110px
        130px
        85px;

    gap: 15px;

    margin-bottom: 30px;
}

.labels-flex {

    grid-column: 2;

    display: flex;

    justify-content: space-between;

    color: var(--text-muted);

    font-size: 12px;

    padding: 0 5px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer-metrics {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    border-top:
        1px solid var(--border);

    padding-top: 25px;

    text-align: center;
}

.metric-box {

    border-right:
        1px solid var(--border);
}

.metric-box:last-child {

    border-right: none;
}

.metric-label {

    font-size: 12px;

    color: var(--text-muted);

    text-transform: uppercase;

    margin-bottom: 8px;
}

.metric-value {

    font-size: 24px;

    font-weight: bold;
}

.text-green {
    color: var(--green);
}

.text-red {
    color: var(--red);
}


/* =====================================================
   ADMIN ACCESS
===================================================== */

.admin-trigger-zone {

    text-align: center;

    margin-top: 30px;

    padding-bottom: 20px;
}

.login-btn {

    background-color: #242933;

    border:
        1px solid var(--border);

    color: #d1d5db;

    font-size: 14px;

    padding: 12px 28px;

    border-radius: 6px;

    cursor: pointer;

    font-weight: bold;

    display: inline-flex;

    align-items: center;

    gap: 8px;

    transition: all 0.2s ease;

    box-shadow:
        0 4px 10px rgba(0,0,0,0.3);
}

.login-btn:hover {

    background-color: var(--blue);

    color: #fff;

    border-color: var(--blue);

    transform:
        translateY(-2px);
}


/* =====================================================
   EMPTY
===================================================== */

.empty-message {

    text-align: center;

    color: var(--text-muted);

    padding: 40px 10px;

    border:
        1px dashed var(--border);

    border-radius: 6px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 1000px) {

    .dashboard {
        padding: 22px 15px;
    }

    .table-title-row {
        display: none;
    }

    .material-row {

        grid-template-columns:
            1fr 1fr;

        gap: 12px;

        padding: 18px 0;

        border-bottom:
            1px solid var(--border);
    }

    .info-col {
        grid-column: 1 / -1;
    }

    .progress-wrapper {
        grid-column: 1 / -1;
    }

    .qty-col,
    .unit-price-col,
    .total-value-col {
        text-align: left;
    }

    .action-col {
        text-align: left;
    }

    .axis-labels {
        display: none;
    }
}


@media (max-width: 700px) {

    body {
        padding: 15px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .admin-title {
        flex-direction: column;
        align-items: flex-start;
    }

    .footer-metrics {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .metric-box {
        border-right: none;
        border-bottom:
            1px solid var(--border);
        padding-bottom: 15px;
    }

    .metric-box:last-child {
        border-bottom: none;
    }

    .title {
        font-size: 19px;
    }

    .material-row {
        grid-template-columns: 1fr;
    }

    .qty-col,
    .unit-price-col,
    .total-value-col,
    .action-col {
        text-align: left;
    }
}

</style>
</head>


<body>


<div class="container">


<!-- =====================================================
     ADMIN PANEL
===================================================== -->

<div
    class="admin-panel"
    id="adminPanel">

    <div class="admin-title">

        <div>

            RAW MATERIALS ENTRY FORM

            <span class="admin-status">
                ● Admin Mode
            </span>

        </div>

        <button
            type="button"
            class="btn btn-logout"
            onclick="logoutAdmin()">

            Close Admin Panel

        </button>

    </div>


    <form
        id="materialForm"
        onsubmit="saveMaterial(event)">


        <div class="form-grid">


            <!-- MATERIAL NAME -->

            <div class="form-group">

                <label>
                    Material Name
                </label>

                <input
                    type="text"
                    id="matName"
                    required
                    placeholder="e.g. Duplex">

            </div>


            <!-- TOTAL KG -->

            <div class="form-group">

                <label>
                    Total Kg
                </label>

                <input
                    type="number"
                    id="maxQty"
                    min="0"
                    step="any"
                    required
                    placeholder="e.g. 10000">

            </div>


            <!-- REMAINING BALANCE -->

            <div class="form-group">

                <label>
                    Remaining Balance
                </label>

                <input
                    type="number"
                    id="remainingBalance"
                    min="0"
                    step="any"
                    required
                    placeholder="e.g. 6000">

            </div>


            <!-- UNIT -->

            <div class="form-group">

                <label>
                    Unit
                </label>

                <input
                    type="text"
                    id="unit"
                    required
                    placeholder="Kg">

            </div>


            <!-- UNIT PRICE -->

            <div class="form-group">

                <label>
                    Unit Price ($)
                </label>

                <input
                    type="number"
                    id="unitPrice"
                    min="0"
                    step="any"
                    required
                    placeholder="e.g. 0.80">

            </div>


            <!-- BLUE -->

            <div class="form-group">

                <label>
                    Highlight Blue?
                </label>

                <select id="isBlue">

                    <option value="false">
                        No
                    </option>

                    <option value="true">
                        Yes
                    </option>

                </select>

            </div>

        </div>


        <button
            type="submit"
            class="btn btn-blue"
            id="saveButton">

            Save Material

        </button>


        <button
            type="button"
            class="btn btn-logout"
            id="cancelEditButton"
            onclick="cancelEdit()"
            style="display:none;">

            Cancel Edit

        </button>

    </form>

</div>


<!-- =====================================================
     DASHBOARD
===================================================== -->

<div class="dashboard">


    <div class="header">

        <div class="company-name">

            Seven Classic Ind. Ltd.

        </div>

        <div class="title">

            Live Raw Material Balance Tracker

        </div>

    </div>


    <!-- TABLE HEADER -->

    <div class="table-title-row">

        <div class="table-title-text">
            Raw Materials
        </div>

        <div class="table-title-text">
            Balance Level
        </div>

        <div
            class="table-title-text"
            style="text-align:right;">

            Remaining Balance

        </div>

        <div
            class="table-title-text"
            style="text-align:right;">

            Unit Price

        </div>

        <div
            class="table-title-text"
            style="text-align:right;">

            Total Value

        </div>

        <div class="table-title-text action-col">
            Action
        </div>

    </div>


    <!-- MATERIAL LIST -->

    <div
        class="materials-container"
        id="materials-list">

    </div>


    <!-- AXIS -->

    <div class="axis-labels">

        <div></div>

        <div class="labels-flex">

            <span>20%</span>
            <span>40%</span>
            <span>60%</span>
            <span>80%</span>
            <span>100%</span>

        </div>

        <div></div>
        <div></div>
        <div></div>
        <div></div>

    </div>


    <!-- =================================================
         FOOTER METRICS
    ================================================= -->

    <div class="footer-metrics">


        <!-- TOTAL REMAINING KG -->

        <div class="metric-box">

            <div class="metric-label">
    Remaining Raw Material Volume
</div>

            <div
                class="metric-value"
                id="total-kg">

                0 kg

            </div>

        </div>


        <!-- TOTAL VALUE -->

        <div class="metric-box">

            <div class="metric-label">
                Total Value
            </div>

            <div
                class="metric-value text-green"
                id="total-value">

                $0.00

            </div>

        </div>


        <!-- LOW BALANCE -->

        <div class="metric-box">

            <div class="metric-label">
                Low Balance Warning
            </div>

            <div
                class="metric-value text-green"
                id="low-warning">

                0

            </div>

        </div>

    </div>

</div>


<!-- ADMIN ACCESS -->

<div class="admin-trigger-zone">

    <button
        type="button"
        class="login-btn"
        onclick="openAdminPanel()">

        🔐 Admin Panel Access

    </button>

</div>


</div>


<script>


/* =====================================================
   SETTINGS
===================================================== */

const ADMIN_PASSWORD = "seven8081";

const STORAGE_KEY =
    "sevenClassicMaterials";

let materials = [];

let editingIndex = -1;


/* =====================================================
   LOAD DATA
===================================================== */

function loadMaterials() {

    const saved =
        localStorage.getItem(STORAGE_KEY);


    if (!saved) {

        materials = [];

        renderMaterials();

        return;
    }


    try {

        materials =
            JSON.parse(saved);


        /*
         * OLD DATA SUPPORT
         *
         * currentQty -> remainingBalance
         */

        materials =
            materials.map(item => {


                if (
                    item.remainingBalance === undefined
                    &&
                    item.currentQty !== undefined
                ) {

                    item.remainingBalance =
                        Number(item.currentQty) || 0;

                }


                /*
                 * Old data may have fullValue.
                 * New version uses unitPrice.
                 */

                if (
                    item.unitPrice === undefined
                ) {

                    item.unitPrice = 0;

                }


                return item;

            });


    } catch (error) {

        materials = [];

    }


    renderMaterials();

}


/* =====================================================
   STORAGE
===================================================== */

function saveToStorage() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(materials)
    );

}


/* =====================================================
   ADMIN LOGIN
===================================================== */

function openAdminPanel() {

    const password =
        prompt(
            "Enter Admin Password:"
        );


    if (password === null) {
        return;
    }


    if (
        password === ADMIN_PASSWORD
    ) {

        document
            .getElementById("adminPanel")
            .style.display =
            "block";


        document
            .body
            .classList
            .add("admin-logged-in");


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });


    } else {

        alert(
            "❌ Incorrect Admin Password!"
        );

    }

}


/* =====================================================
   ADMIN LOGOUT
===================================================== */

function logoutAdmin() {

    document
        .getElementById("adminPanel")
        .style.display =
        "none";


    document
        .body
        .classList
        .remove("admin-logged-in");


    cancelEdit();

}


/* =====================================================
   SAVE MATERIAL
===================================================== */

function saveMaterial(event) {

    event.preventDefault();


    const name =
        document
            .getElementById("matName")
            .value
            .trim();


    const maxQty =
        Number(
            document
                .getElementById("maxQty")
                .value
        );


    const remainingBalance =
        Number(
            document
                .getElementById("remainingBalance")
                .value
        );


    const unit =
        document
            .getElementById("unit")
            .value
            .trim();


    const unitPrice =
        Number(
            document
                .getElementById("unitPrice")
                .value
        );


    const isBlue =
        document
            .getElementById("isBlue")
            .value === "true";


    /* =========================
       VALIDATION
    ========================= */

    if (!name) {

        alert(
            "Please enter material name."
        );

        return;
    }


    if (maxQty <= 0) {

        alert(
            "Total Kg must be greater than 0."
        );

        return;
    }


    if (remainingBalance < 0) {

        alert(
            "Remaining Balance cannot be negative."
        );

        return;
    }


    if (
        remainingBalance > maxQty
    ) {

        alert(
            "Remaining Balance cannot be greater than Total Kg."
        );

        return;
    }


    if (unitPrice < 0) {

        alert(
            "Unit Price cannot be negative."
        );

        return;
    }


    /* =========================
       MATERIAL OBJECT
    ========================= */

    const material = {

        name: name,

        maxQty: maxQty,

        remainingBalance:
            remainingBalance,

        unit: unit,

        unitPrice:
            unitPrice,

        isBlue:
            isBlue

    };


    /* =========================
       UPDATE
    ========================= */

    if (
        editingIndex !== -1
    ) {

        materials[editingIndex] =
            material;


        alert(
            "✅ Material updated successfully."
        );

    }


    /* =========================
       ADD NEW
    ========================= */

    else {

        materials.push(
            material
        );


        alert(
            "✅ Material added successfully."
        );

    }


    saveToStorage();

    renderMaterials();

    resetForm();

}


/* =====================================================
   RENDER MATERIALS
===================================================== */

function renderMaterials() {

    const container =
        document.getElementById(
            "materials-list"
        );


    container.innerHTML = "";


    /* =========================
       EMPTY
    ========================= */

    if (
        materials.length === 0
    ) {

        container.innerHTML = `

            <div class="empty-message">

                No raw materials added yet.

                <br><br>

                Click
                <strong>Admin Panel Access</strong>
                to add materials.

            </div>

        `;


        updateMetrics();

        return;

    }


    /* =========================
       LOOP
    ========================= */

    materials.forEach(
        (material, index) => {


        const totalKg =
            Number(
                material.maxQty
            ) || 0;


        const remaining =
            Number(
                material.remainingBalance
            ) || 0;


        const unitPrice =
            Number(
                material.unitPrice
            ) || 0;


        /*
         * TOTAL VALUE
         *
         * Remaining Balance
         * ×
         * Unit Price
         */

        const totalValue =
            remaining * unitPrice;


        /*
         * BALANCE %
         */

        let percentage =
            totalKg > 0
                ? (
                    remaining /
                    totalKg
                ) * 100
                : 0;


        percentage =
            Math.max(
                0,
                Math.min(
                    100,
                    percentage
                )
            );


        /* =========================
           PROGRESS COLOR
        ========================= */

        let progressClass =
            "bg-green";

        let stockClass =
            "good-stock-text";


        if (
            percentage < 20
        ) {

            progressClass =
                "bg-red";

            stockClass =
                "low-stock-text";

        }

        else if (
            percentage < 40
        ) {

            progressClass =
                "bg-yellow";

        }


        /* =========================
           BLUE NAME
        ========================= */

        const blueClass =
            material.isBlue
                ? "highlight-blue"
                : "";


        /* =========================
           ROW
        ========================= */

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "material-row";


        row.innerHTML = `

            <!-- MATERIAL -->

            <div class="info-col">

                <div
                    class="material-name ${blueClass}">

                    ${escapeHTML(
                        material.name
                    )}

                </div>

                <div class="material-val">

                    Total:
                    ${formatNumber(
                        totalKg
                    )}
                    ${escapeHTML(
                        material.unit
                    )}

                </div>

            </div>


            <!-- BALANCE BAR -->

            <div>

                <div
                    class="progress-wrapper">

                    <div
                        class="progress-bar ${progressClass}"
                        style="
                            width:${percentage}%;
                        ">

                    </div>

                </div>

            </div>


            <!-- REMAINING BALANCE -->

            <div class="qty-col">

                <span
                    class="${stockClass}">

                    ${formatNumber(
                        remaining
                    )}
                    ${escapeHTML(
                        material.unit
                    )}

                </span>

                <span class="usd-live-val">

                    ${percentage.toFixed(1)}%
                    remaining

                </span>

            </div>


            <!-- UNIT PRICE -->

            <div class="unit-price-col">

                $${formatMoney(
                    unitPrice
                )}

                <span class="price-label">

                    per
                    ${escapeHTML(
                        material.unit
                    )}

                </span>

            </div>


            <!-- TOTAL VALUE -->

            <div class="total-value-col">

                $${formatMoney(
                    totalValue
                )}

                <span class="price-label">

                    ${formatNumber(
                        remaining
                    )}
                    ×
                    $${formatMoney(
                        unitPrice
                    )}

                </span>

            </div>


            <!-- ACTION -->

            <div class="action-col">

                <button
                    type="button"
                    class="btn btn-edit"
                    onclick="editMaterial(${index})">

                    Edit

                </button>

                <button
                    type="button"
                    class="btn btn-red"
                    onclick="deleteMaterial(${index})">

                    Delete

                </button>

            </div>

        `;


        container.appendChild(
            row
        );

    });


    updateMetrics();

}


/* =====================================================
   UPDATE FOOTER
===================================================== */

function updateMetrics() {

    /*
     * IMPORTANT:
     *
     * TOTAL KG
     * =
     * ALL REMAINING BALANCE
     *
     * NOT Total Kg / Capacity
     */

    let totalKg = 0;


    /*
     * TOTAL VALUE
     *
     * Remaining Balance × Unit Price
     */

    let totalValue = 0;


    /*
     * LOW BALANCE COUNT
     */

    let lowBalanceCount = 0;


    materials.forEach(
        material => {


        const maxQty =
            Number(
                material.maxQty
            ) || 0;


        const remaining =
            Number(
                material.remainingBalance
            ) || 0;


        const unitPrice =
            Number(
                material.unitPrice
            ) || 0;


        /* =============================================
           Remaining Raw Material Volume
           
           ONLY REMAINING BALANCE IS ADDED
        ============================================= */

        totalKg += remaining;


        /* =============================================
           TOTAL VALUE
           
           Remaining Balance × Unit Price
        ============================================= */

        totalValue +=
            remaining * unitPrice;


        /* =============================================
           LOW BALANCE
        ============================================= */

        const percentage =
            maxQty > 0
                ? (
                    remaining /
                    maxQty
                ) * 100
                : 0;


        if (
            percentage < 20
        ) {

            lowBalanceCount++;

        }

    });


    /* =================================================
       TOTAL KG DISPLAY
    ================================================= */

    document
        .getElementById("total-kg")
        .textContent =
        formatNumber(
            totalKg
        ) + " kg";


    /* =================================================
       TOTAL VALUE DISPLAY
    ================================================= */

    document
        .getElementById("total-value")
        .textContent =
        "$" +
        formatMoney(
            totalValue
        );


    /* =================================================
       LOW WARNING
    ================================================= */

    const warning =
        document.getElementById(
            "low-warning"
        );


    warning.textContent =
        lowBalanceCount;


    if (
        lowBalanceCount > 0
    ) {

        warning.className =
            "metric-value text-red";

    } else {

        warning.className =
            "metric-value text-green";

    }

}


/* =====================================================
   EDIT
===================================================== */

function editMaterial(index) {

    const material =
        materials[index];


    document
        .getElementById("matName")
        .value =
        material.name;


    document
        .getElementById("maxQty")
        .value =
        material.maxQty;


    document
        .getElementById("remainingBalance")
        .value =
        material.remainingBalance;


    document
        .getElementById("unit")
        .value =
        material.unit;


    document
        .getElementById("unitPrice")
        .value =
        material.unitPrice;


    document
        .getElementById("isBlue")
        .value =
        material.isBlue
            ? "true"
            : "false";


    editingIndex =
        index;


    document
        .getElementById("saveButton")
        .textContent =
        "Update Material";


    document
        .getElementById("cancelEditButton")
        .style
        .display =
        "inline-block";


    document
        .getElementById("adminPanel")
        .style
        .display =
        "block";


    document
        .body
        .classList
        .add("admin-logged-in");


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =====================================================
   DELETE
===================================================== */

function deleteMaterial(index) {

    const material =
        materials[index];


    const confirmDelete =
        confirm(
            `Are you sure you want to delete "${material.name}"?`
        );


    if (!confirmDelete) {
        return;
    }


    materials.splice(
        index,
        1
    );


    saveToStorage();

    renderMaterials();


    alert(
        "🗑️ Material deleted successfully."
    );

}


/* =====================================================
   CANCEL EDIT
===================================================== */

function cancelEdit() {

    editingIndex = -1;

    resetForm();

}


/* =====================================================
   RESET FORM
===================================================== */

function resetForm() {

    document
        .getElementById("materialForm")
        .reset();


    document
        .getElementById("isBlue")
        .value =
        "false";


    document
        .getElementById("saveButton")
        .textContent =
        "Save Material";


    document
        .getElementById("cancelEditButton")
        .style
        .display =
        "none";


    editingIndex = -1;

}


/* =====================================================
   NUMBER FORMAT
===================================================== */

function formatNumber(number) {

    return Number(number)
        .toLocaleString(
            "en-US",
            {
                maximumFractionDigits: 2
            }
        );

}


/* =====================================================
   MONEY FORMAT
===================================================== */

function formatMoney(number) {

    return Number(number)
        .toLocaleString(
            "en-US",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadMaterials();

    }
);

</script>
