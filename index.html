<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven Classic Ind. Ltd. - Dashboard & Admin</title>
    <style>
        :root {
            --bg-color: #1a1d24;
            --card-bg: #13161c;
            --text-main: #ffffff;
            --text-muted: #8a92a6;
            --green: #2ecc71;
            --red: #e74c3c;
            --blue: #3498db;
            --border: #2c313d;
            --admin-bg: #1c212c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        /* 🛠️ অ্যাডমিন ফর্ম ডিজাইন - এটি সবসময় স্ক্রিনে দেখা যাবে */
        .admin-panel {
            background-color: var(--admin-bg);
            border: 2px dashed var(--blue);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .admin-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--blue);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-blue { background-color: var(--blue); color: #fff; }
        .btn-red { background-color: var(--red); color: #fff; padding: 4px 8px; font-size: 12px; }

        /* 📊 ড্যাশবোর্ড ডিজাইন */
        .dashboard {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .header { margin-bottom: 20px; }
        .company-name { font-size: 14px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; font-weight: bold; }
        .title { font-size: 22px; margin: 5px 0 0 0; font-weight: 600; }

        .table-title-row, .material-row {
            display: grid;
            grid-template-columns: 220px 1fr 180px 80px;
            gap: 20px;
            align-items: center;
        }

        .table-title-row {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .table-title-text { font-size: 13px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }

        .materials-container { margin-bottom: 40px; }
        .material-row { margin-bottom: 25px; }
        .info-col { display: flex; flex-direction: column; }
        .material-name { font-size: 16px; font-weight: bold; text-transform: uppercase;}
        .material-name.highlight-blue { color: var(--blue); }
        .material-val { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .progress-wrapper { background-color: #1a1e26; border-radius: 20px; height: 14px; width: 100%; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; border-radius: 20px; transition: width 0.5s ease; }
        .bg-green { background-color: var(--green); }
        .bg-red { background-color: var(--red); }

        .qty-col { text-align: right; font-weight: bold; font-size: 14px; line-height: 1.4; }
        .usd-live-val { font-size: 12px; color: var(--text-muted); font-weight: normal; display: block; }
        .text-red .usd-live-val { color: #ff8a80; }

        .axis-labels { display: grid; grid-template-columns: 220px 1fr 260px; margin-bottom: 30px; }
        .labels-flex { grid-column: 2; display: flex; justify-content: space-between; color: var(--text-muted); font-size: 12px; padding: 0 5px; }

        .footer-metrics { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); padding-top: 25px; text-align: center; }
        .metric-box { border-right: 1px solid var(--border); }
        .metric-box:last-child { border-right: none; }
        .metric-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 24px; font-weight: bold; }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }
        
        .action-col { text-align: center; }
    </style>
</head>
<body>

<div class="container">

    <!-- 🛠️ DIRECT ADMIN ENTRY PANEL (সবসময় দৃশ্যমান) -->
    <div class="admin-panel">
        <div class="admin-title">Raw Materials Entry Form</div>
        <form id="materialForm" onsubmit="addMaterial(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Material Name</label>
                    <input type="text" id="matName" required placeholder="e.g. Polyester Yarn">
                </div>
                <div class="form-group">
                    <label>Maximum Qty (Capacity)</label>
                    <input type="number" id="maxQty" required placeholder="e.g. 10000">
                </div>
                <div class="form-group">
                    <label>Current Stock</label>
                    <input type="number" id="currentQty" required placeholder="e.g. 4010">
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    <input type="text" id="unit" required placeholder="Kg, Pcs, Yards">
                </div>
                <div class="form-group">
                    <label>Full Budget Value ($)</label>
                    <input type="number" id="fullValue" required placeholder="e.g. 25000">
                </div>
                <div class="form-group">
                    <label>Highlight Blue?</label>
                    <select id="isBlue">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-blue">Save & Update Stock</button>
        </form>
    </div>

    <!-- 📊 LIVE TRACKER DASHBOARD -->
    <div class="dashboard">
        <div class="header">
            <div class="company-name">Seven Classic Ind. Ltd.</div>
            <div class="title">Live Raw Material Material Balance Tracker</div>
        </div>

        <div class="table-title-row">
            <div class="table-title-text">Raw Materials Name</div>
            <div></div>
            <div class="table-title-text" style="text-align: right;">Live Status / Stock</div>
            <div class="table-title-text action-col">Action</div>
        </div>

        <!-- ডিফল্ট প্রোডাক্ট মেটেরিয়াল লিস্ট এখানে সরাসরি লোড হবে -->
        <div class="materials-container" id="materials-list">
            <!-- Polyester Yarn -->
            <div class="material-row" id="row-1">
                <div class="info-col">
                    <span class="material-name">Polyester Yarn</span>
                    <span class="material-val">Val: $25,000</span>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-bar bg-green" style="width: 40.1%"></div>
                </div>
                <div class="qty-col">
                    4,010 Kg
                    <span class="usd-live-val">($10,025 USD)</span>
                </div>
                <div class="action-col">
                    <button class="btn btn-red" onclick="document.getElementById('row-1').remove(); recalculate();">Delete</button>
                </div>
            </div>

            <!-- Duplex Board -->
            <div class="material-row" id="row-2">
                <div class="info-col">
                    <span class="material-name">Duplex Board</span>
                    <span class="material-val">Val: $19,000</span>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-bar bg-green" style="width: 60.0%"></div>
                </div>
                <div class="qty-col">
                    6,002 Kg
                    <span class="usd-live-val">($11,404 USD)</span>
                </div>
                <div class="action-col">
                    <button class="btn btn-red" onclick="document.getElementById('row-2').remove(); recalculate();">Delete</button>
                </div>
            </div>

            <!-- Art Card -->
            <div class="material-row" id="row-3">
                <div class="info-col">
                    <span class="material-name text-red">Art Card</span>
                    <span class="material-val">Val: $8,000</span>
                </div>
                <div class="progress-wrapper">
                    <div class="progress-bar bg-red" style="width: 23.8%"></div>
                </div>
                <div class="qty-col text-red">
                    11,916 Kg
