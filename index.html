<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven Classic Ind. Ltd. - Dashboard & Admin</title>
    <style>
        :root {
            --bg-color: #1a1d24;
            --card-bg: #13161c;
            --text-main: #ffffff;
            --text-muted: #8a92a6;
            --green: #2ecc71;
            --red: #e74c3c;
            --blue: #3498db;
            --border: #2c313d;
            --admin-bg: #1c212c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            gap: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        /* Admin Panel Styles */
        .admin-panel {
            background-color: var(--admin-bg);
            border: 2px dashed var(--blue);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            display: none; /* শুরুতে লুকানো থাকবে */
        }

        .admin-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--blue);
            margin-bottom: 15px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-blue { background-color: var(--blue); color: #fff; }
        .btn-red { background-color: var(--red); color: #fff; padding: 4px 8px; font-size: 12px; }
        .btn-logout { background-color: #555; color: #fff; font-size: 12px; padding: 5px 10px; }

        /* Dashboard Styles */
        .dashboard {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .header { margin-bottom: 20px; }
        .company-name { font-size: 14px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; font-weight: bold; }
        .title { font-size: 22px; margin: 5px 0 0 0; font-weight: 600; }

        .table-title-row, .material-row {
            display: grid;
            grid-template-columns: 220px 1fr 180px 80px; /* ডিলিট বাটনের জন্য একটি কলাম বাড়ানো হয়েছে */
            gap: 20px;
            align-items: center;
        }

        .table-title-row {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .table-title-text { font-size: 13px; color: var(--text-muted); font-weight: bold; text-transform: uppercase; }

        .materials-container { margin-bottom: 40px; }
        .material-row { margin-bottom: 25px; }
        .info-col { display: flex; flex-direction: column; }
        .material-name { font-size: 16px; font-weight: bold; text-transform: uppercase;}
        .material-name.highlight-blue { color: var(--blue); }
        .material-val { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        .progress-wrapper { background-color: #1a1e26; border-radius: 20px; height: 14px; width: 100%; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; border-radius: 20px; transition: width 0.5s ease; }
        .bg-green { background-color: var(--green); }
        .bg-red { background-color: var(--red); }

        .qty-col { text-align: right; font-weight: bold; font-size: 14px; line-height: 1.4; }
        .usd-live-val { font-size: 12px; color: var(--text-muted); font-weight: normal; display: block; }
        .text-red .usd-live-val { color: #ff8a80; }

        .axis-labels { display: grid; grid-template-columns: 220px 1fr 260px; margin-bottom: 30px; }
        .labels-flex { grid-column: 2; display: flex; justify-content: space-between; color: var(--text-muted); font-size: 12px; padding: 0 5px; }

        .footer-metrics { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); padding-top: 25px; text-align: center; }
        .metric-box { border-right: 1px solid var(--border); }
        .metric-box:last-child { border-right: none; }
        .metric-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .metric-value { font-size: 24px; font-weight: bold; }
        .text-green { color: var(--green); }
        .text-red { color: var(--red); }

        /* Action column for admin logout/login */
        .admin-trigger-zone { text-align: center; margin-top: 20px; }
        .login-link { color: #333; font-size: 12px; text-decoration: none; cursor: pointer; }
        
        /* ডিলিট বাটনটি সাধারণত লুকানো থাকবে, শুধু অ্যাডমিন লগইন করলেই দেখাবে */
        .action-col { display: none; text-align: center; }
        body.admin-logged-in .action-col { display: block; }
    </style>
</head>
<body>

<div class="container">

    <!-- 🛠️ ADMIN ENTRY PANEL -->
    <div class="admin-panel" id="adminPanel">
        <div class="admin-title">
            <span>Raw Materials Entry Form</span>
            <button class="btn btn-logout" onclick="logoutAdmin()">Close Admin</button>
        </div>
        <form id="materialForm" onsubmit="addMaterial(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Material Name</label>
                    <input type="text" id="matName" required placeholder="e.g. Duplex Board">
                </div>
                <div class="form-group">
                    <label>Maximum Qty (Capacity)</label>
                    <input type="number" id="maxQty" required placeholder="e.g. 10000">
                </div>
                <div class="form-group">
                    <label>Current Stock</label>
                    <input type="number" id="currentQty" required placeholder="e.g. 6000">
                </div>
                <div class="form-group">
                    <label>Unit</label>
                    <input type="text" id="unit" required placeholder="Kg, Pcs, Yards">
                </div>
                <div class="form-group">
                    <label>Full Budget Value ($)</label>
                    <input type="number" id="fullValue" required placeholder="e.g. 19000">
                </div>
                <div class="form-group">
                    <label>Highlight Blue?</label>
                    <select id="isBlue">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-blue">Save & Update Stock</button>
        </form>
    </div>

    <!-- 📊 LIVE TRACKER DASHBOARD -->
    <div class="dashboard">
        <div class="header">
            <div class="company-name">Seven Classic Ind. Ltd.</div>
            <div class="title">Live Raw Material Material Balance Tracker</div>
        </div>

        <div class="table-title-row">
            <div class="table-title-text">Raw Materials Name</div>
            <div></div>
            <div class="table-title-text" style="text-align: right;">Live Status / Stock</div>
            <div class="table-title-text action-col">Action</div>
        </div>

        <div class="materials-container" id="materials-list">
            <!-- Data will be injected here dynamically -->
        </div>

        <div class="axis-labels">
            <div class="labels-flex">
                <span>20%</span>
                <span>40%</span>
                <span>60%</span>
                <span>80%</span>
                <span>100%</span>
            </div>
        </div>

        <div class="footer-metrics">
            <div class="metric-box">
                <div class="metric-label">Total Value</div>
                <div class="metric-value" id="total-value">$0</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Current Asset Value</div>
                <div class="metric-value text-green" id="current-asset-value">$0</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Low Balance Warning</div>
                <div class="metric-value text-red" id="low-warning-count">0 materials</div>
            </div>
        </div>
    </div>

    <!-- 🔑 LOGIN AREA -->
    <div class="admin-trigger-zone">
        <span class="login-link" onclick="loginAdmin()">🔒 Admin Panel Access</span>
    </div>

</div>

<script>
    // ডেমো প্রাথমিক ডেটা (মেমোরিতে কিছু না থাকলে এটি লোড হবে)
    const defaultMaterials = [
        { id: 1, name: 'Polyester Yarn', maxQty: 10000, currentQty: 4010, unit: 'Kg', fullValue: 25000, isBlue: false },
{ id: 2, name: 'Duplex Board', maxQty: 10000, currentQty: 6002, unit: 'Kg', fullValue: 19000, isBlue: false },
{ id: 3, name: 'Art Card', maxQty: 50000, currentQty: 11916, unit: 'Kg', fullValue: 8000, isBlue: false },
{ id: 4, name: 'metallic yarn', maxQty: 2000, currentQty: 313, unit: 'Kg', fullValue: 4500, isBlue: false },
{ id: 5, name: 'Artificial Leather', maxQty: 10000, currentQty: 2779, unit: 'Kg', fullValue: 450000, isBlue: true }
];
// LocalStorage থেকে ডেটা নেওয়া
let materialsData = JSON.parse(localStorage.getItem('factory_materials')) || defaultMaterials;
// অ্যাডমিন লগইন পাসওয়ার্ড ভেরিফিকেশন (পাসওয়ার্ড: admin123)
function loginAdmin() {
const password = prompt("অনুগ্রহ করে অ্যাডমিন পাসওয়ার্ড দিন:");
if (password === "admin123") {
document.getElementById('adminPanel').style.display = 'block';
document.body.classList.add('admin-logged-in');
updateDashboard();
} else if (password !== null) {
alert("ভুল পাসওয়ার্ড! আবার চেষ্টা করুন।");
}
}
function logoutAdmin() {
document.getElementById('adminPanel').style.display = 'none';
document.body.classList.remove('admin-logged-in');
updateDashboard();
}
// নতুন মেটেরিয়াল যুক্ত করা
function addMaterial(e) {
e.preventDefault();
const newMat = {
id: Date.now(),
name: document.getElementById('matName').value,
maxQty: Number(document.getElementById('maxQty').value),
currentQty: Number(document.getElementById('currentQty').value),
unit: document.getElementById('unit').value,
fullValue: Number(document.getElementById('fullValue').value),
isBlue: document.getElementById('isBlue').value === 'true'
};
materialsData.push(newMat);
saveAndRefresh();
document.getElementById('materialForm').reset();
}
// মেটেরিয়াল ডিলিট করা
function deleteMaterial(id) {
if(confirm("আপনি কি নিশ্চিতভাবে এই আইটেমটি ডিলিট করতে চান?")) {
materialsData = materialsData.filter(mat => mat.id !== id);
saveAndRefresh();
}
}
// ডেটা লোকাল স্টোরেজে সেভ করা ও রেন্ডার করা
function saveAndRefresh() {
localStorage.setItem('factory_materials', JSON.stringify(materialsData));
updateDashboard();
}
function updateDashboard() {
const container = document.getElementById('materials-list');
container.innerHTML = '';
let totalValueSum = 0;
let currentAssetValueSum = 0;
let lowWarningCount = 0;
materialsData.forEach(mat => {
const percentage = Math.min(100, (mat.currentQty / mat.maxQty) * 100);
const currentValue = (mat.fullValue * (percentage / 100));
totalValueSum += mat.fullValue;
currentAssetValueSum += currentValue;
const isLow = percentage < 30;
if (isLow) lowWarningCount++;
const barColorClass = isLow ? 'bg-red' : 'bg-green';
const textColorClass = isLow ? 'text-red' : '';
const nameBlueClass = mat.isBlue ? 'highlight-blue' : '';
const rowHtml = <div class="material-row"> <div class="info-col"> <span class="material-name ${nameBlueClass}">${mat.name}</span> <span class="material-val">Val: $${mat.fullValue.toLocaleString()}</span> </div> <div class="progress-wrapper"> <div class="progress-bar ${barColorClass}" style="width: ${percentage}%"></div> </div> <div class="qty-col ${textColorClass}"> ${mat.currentQty.toLocaleString()} ${mat.unit} <span class="usd-live-val">($${Math.round(currentValue).toLocaleString()} USD)</span> </div> <div class="action-col"> <button class="btn btn-red" onclick="deleteMaterial(${mat.id})">Delete</button> </div> </div>;
container.innerHTML += rowHtml;
});
document.getElementById('total-value').innerText = $${totalValueSum.toLocaleString()};
document.getElementById('current-asset-value').innerText = $${Math.round(currentAssetValueSum).toLocaleString()};
document.getElementById('low-warning-count').innerText = ${lowWarningCount} ${lowWarningCount === 1 ? 'material' : 'materials'};
}
// প্রারম্ভিক রান
updateDashboard();
